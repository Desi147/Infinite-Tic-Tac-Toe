<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶/消失井字棋 Endless Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-o: #38bdf8;
            --accent-x: #f43f5e;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        select {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: #334155;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #475569;
        }

        button.active {
            background-color: #2563eb;
        }

        .status-panel {
            margin: 15px 0;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .warning-text {
            color: var(--warning-color);
            font-size: 0.9rem;
            margin-top: 5px;
            height: 1.2em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            background-color: #0f172a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            position: relative;
        }

        .cell:hover:not(.occupied) {
            background-color: #1e293b;
            border: 2px solid #475569;
        }

        .cell.O {
            color: var(--accent-o);
        }

        .cell.X {
            color: var(--accent-x);
        }

        /* 標示即將消失的棋子 (最舊的一步) */
        .cell.fading {
            opacity: 0.4;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(0.92); }
        }

        .restart-btn {
            width: 100%;
            background-color: #10b981;
            padding: 12px;
            font-size: 1.1rem;
        }

        .restart-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>消 失 井 字 棋</h1>

    <div class="controls">
        <div class="btn-group">
            <button id="mode-pve" class="active" onclick="setMode('pve')">單人對戰 (AI)</button>
            <button id="mode-pvp" onclick="setMode('pvp')">雙人對戰</button>
        </div>
        <div class="btn-group" id="order-group">
            <button id="order-first" class="active" onclick="setOrder(1)">玩家先手 (O)</button>
            <button id="order-second" onclick="setOrder(2)">AI 先手 (O)</button>
        </div>
        <div class="setting-row" id="depth-group">
            <label for="depth-select">AI 搜尋深度 (Depth):</label>
            <select id="depth-select" onchange="setDepth(this.value)">
                <option value="1">1 (最簡單)</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8" selected>8</option>
                <option value="9">9</option>
                <option value="10">10 (最困難)</option>
            </select>
        </div>
    </div>

    <div class="status-panel">
        <div id="status" class="status-text">O 輪流落子</div>
        <div id="warning" class="warning-text"></div>
    </div>

    <div class="board" id="board">
        <!-- 9個格子 -->
    </div>

    <button class="restart-btn" onclick="initGame()">重新開始遊戲</button>
</div>

<script>
    // 遊戲狀態 variables
    let mode = 'pve'; // 'pve' 或 'pvp'
    let order = 1;     // 1: 玩家先手, 2: AI先手
    let maxDepth = 8;  // AI 搜尋深度，可從 UI 調整 (1-10)
    let boardState = Array(9).fill(null);
    let moveHistory = []; // 紀錄歷史落子位置 (0-8)
    let turnCount = 0;
    let gameOver = false;
    let playerSide = 'O';
    let aiSide = 'X';

    // 初始化渲染與綁定
    function setMode(selectedMode) {
        mode = selectedMode;
        document.getElementById('mode-pve').classList.toggle('active', mode === 'pve');
        document.getElementById('mode-pvp').classList.toggle('active', mode === 'pvp');
        document.getElementById('order-group').style.display = mode === 'pve' ? 'flex' : 'none';
        document.getElementById('depth-group').style.display = mode === 'pve' ? 'flex' : 'none';
        initGame();
    }

    function setOrder(selectedOrder) {
        order = selectedOrder;
        document.getElementById('order-first').classList.toggle('active', order === 1);
        document.getElementById('order-second').classList.toggle('active', order === 2);
        initGame();
    }

    function setDepth(val) {
        maxDepth = parseInt(val, 10);
    }

    function initGame() {
        boardState = Array(9).fill(null);
        moveHistory = [];
        turnCount = 0;
        gameOver = false;

        if (mode === 'pve') {
            playerSide = order === 1 ? 'O' : 'X';
            aiSide = order === 1 ? 'X' : 'O';
        }

        renderBoard();
        updateStatus();

        // 若是 AI 先手，觸發 AI 落子
        if (mode === 'pve' && order === 2) {
            setTimeout(aiMakeMove, 400);
        }
    }

    // 建立與更新 UI Board
    function renderBoard() {
        const boardElem = document.getElementById('board');
        boardElem.innerHTML = '';

        boardState.forEach((val, idx) => {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (val) {
                cell.classList.add('occupied', val);
                cell.innerText = val;
            }

            // 標示第 6 步後、即將消失的棋子 (moveHistory[0])
            if (moveHistory.length >= 6 && moveHistory[0] === idx && !gameOver) {
                cell.classList.add('fading');
            }

            cell.addEventListener('click', () => handleCellClick(idx));
            boardElem.appendChild(cell);
        });
    }

    function handleCellClick(idx) {
        if (gameOver || boardState[idx] !== null) return;

        // 如果是 PVE 且當前為 AI 回合，阻止點擊
        if (mode === 'pve') {
            const isPlayerTurn = (turnCount % 2 === 0 && playerSide === 'O') || (turnCount % 2 === 1 && playerSide === 'X');
            if (!isPlayerTurn) return;
        }

        executeMove(idx);

        if (!gameOver && mode === 'pve') {
            setTimeout(aiMakeMove, 300);
        }
    }

    function executeMove(idx) {
        const currentRole = turnCount % 2 === 0 ? 'O' : 'X';
        
        boardState[idx] = currentRole;
        moveHistory.push(idx);
        turnCount++;

        // 核心邏輯：步數超過 6 步，移除最舊的一步 (第 1 步)
        if (moveHistory.length > 6) {
            const removedIdx = moveHistory.shift();
            boardState[removedIdx] = null;
        }

        // 檢查勝負
        if (checkWin(boardState, currentRole)) {
            gameOver = true;
            renderBoard();
            document.getElementById('status').innerText = `${currentRole} 獲得勝利！🎉`;
            document.getElementById('warning').innerText = '';
            return;
        }

        renderBoard();
        updateStatus();
    }

    function updateStatus() {
        if (gameOver) return;
        const currentRole = turnCount % 2 === 0 ? 'O' : 'X';
        document.getElementById('status').innerText = `輪到 ${currentRole} 落子`;

        // 提醒即將消去
        const warningElem = document.getElementById('warning');
        if (moveHistory.length >= 6) {
            warningElem.innerText = `⚠️ 警告：位置 ${moveHistory[0] + 1} 的棋子即將消失！`;
        } else {
            warningElem.innerText = '';
        }
    }

    // 勝負判斷算法
    function checkWin(board, role) {
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 橫向
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 縱向
            [0, 4, 8], [2, 4, 6]             // 對角線
        ];
        return winPatterns.some(pattern => 
            pattern.every(index => board[index] === role)
        );
    }

    // ===== 新增的 C++ 估值輔助函數 (1-based index 轉譯) =====
    function checkIfOnTheSameLine(a, b, c) {
        const lines = [
            [1,2,3], [4,5,6], [7,8,9],
            [1,4,7], [2,5,8], [3,6,9],
            [1,5,9], [3,5,7]
        ];
        let temp = [a, b, c].sort((x, y) => x - y);
        return lines.some(line => line[0] === temp[0] && line[1] === temp[1] && line[2] === temp[2]);
    }

    function evaluateBoard(board, seat, computerRole) {
        let score = 0;
        // C++ 的 seat 使用 1-based index (1-9)
        let seat1Based = seat.map(x => x + 1);

        if (seat1Based.length === 6) {
            let whitespace = [];
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    whitespace.push(i + 1);
                }
            }

            for (let i = 0; i < 3; i++) {
                let sameLine1 = checkIfOnTheSameLine(whitespace[i], seat1Based[1], seat1Based[4]);
                if (sameLine1) {
                    if (board[seat1Based[4] - 1] === computerRole) {
                        score += 10;
                    } else {
                        score -= 10;
                    }
                }

                let sameLine2 = checkIfOnTheSameLine(whitespace[i], seat1Based[2], seat1Based[4]);
                if (sameLine2) {
                    if (board[seat1Based[4] - 1] === computerRole) {
                        score += 30;
                    } else {
                        score -= 30;
                    }
                }
            }

            let sameLine3 = checkIfOnTheSameLine(seat1Based[0], seat1Based[3], seat1Based[5]);
            if (sameLine3) {
                if (board[seat1Based[3] - 1] === computerRole) {
                    score += 20;
                } else {
                    score -= 20;
                }
            }
        }
        return score;
    }

    // ===== 轉譯 C++ 的 Minimax 機器人邏輯 =====
    function aiMakeMove() {
        if (gameOver) return;

        let bestEval = -Infinity;
        let bestMove = -1;
        const depth = maxDepth; // 使用使用者設定的深度

        for (let i = 0; i < 9; i++) {
            if (boardState[i] === null) {
                let tempBoard = [...boardState];
                let tempSeat = [...moveHistory];

                tempBoard[i] = aiSide;
                tempSeat.push(i);
                if (tempSeat.length > 6) {
                    const removed = tempSeat.shift();
                    tempBoard[removed] = null;
                }

                let evalVal = minimax(tempBoard, depth - 1, -Infinity, Infinity, false, tempSeat);
                if (evalVal > bestEval) {
                    bestEval = evalVal;
                    bestMove = i;
                } else if (evalVal === bestEval && Math.floor(Math.random() * 2) === 0) {
                    // 對應 C++ 程式碼中的 rand() % 2 == 0 隨機選擇
                    bestMove = i;
                }
            }
        }

        if (bestMove !== -1) {
            executeMove(bestMove);
        }
    }

    function minimax(board, depth, alpha, beta, isAiTurn, seat) {
        // 上一步角色 (誰剛落子)
        const previousRole = isAiTurn ? playerSide : aiSide;

        if (checkWin(board, previousRole)) {
            // 前一手勝出
            return isAiTurn ? (-100 - depth) : (100 + depth);
        }

        if (depth === 0) {
            // 呼叫更新後的 EvaluateBoard 靜態盤面估值
            return evaluateBoard(board, seat, aiSide);
        }

        if (isAiTurn) {
            let maxEval = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    let nextBoard = [...board];
                    let nextSeat = [...seat];

                    nextBoard[i] = aiSide;
                    nextSeat.push(i);
                    if (nextSeat.length > 6) {
                        const removed = nextSeat.shift();
                        nextBoard[removed] = null;
                    }

                    let evalVal = minimax(nextBoard, depth - 1, alpha, beta, false, nextSeat);
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, maxEval);
                    if (beta <= alpha) break; // Alpha-Beta 剪枝
                }
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    let nextBoard = [...board];
                    let nextSeat = [...seat];

                    nextBoard[i] = playerSide;
                    nextSeat.push(i);
                    if (nextSeat.length > 6) {
                        const removed = nextSeat.shift();
                        nextBoard[removed] = null;
                    }

                    let evalVal = minimax(nextBoard, depth - 1, alpha, beta, true, nextSeat);
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, minEval);
                    if (beta <= alpha) break; // Alpha-Beta 剪枝
                }
            }
            return minEval;
        }
    }

    // 初始化啟動
    initGame();
</script>

</body>
</html>
